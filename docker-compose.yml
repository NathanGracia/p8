services:

  p8-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: p8-api
    volumes:
      - ./samples:/app/samples:ro
      - ./models:/app/models:ro
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      - MODEL_PATH=/app/models/unetmini_20260302_021229.h5
      - DATA_ROOT=/app/samples
    restart: unless-stopped

  p8-streamlit:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: p8-streamlit
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      - API_URL=http://p8-api:8000
    depends_on:
      - p8-api
    restart: unless-stopped
